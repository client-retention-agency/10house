<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Churn Calculator — 10 HOUSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Figtree:wght@400;500;600&family=Satisfy&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff1493;
            --primary-light: #ff69b4;
            --primary-dark: #c71585;
            --dark: #0a0a0a;
            --dark-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --border: #2a2a2a;
            --accent-gold: #d4af37;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a0d15 100%);
            color: var(--text-primary);
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            margin-bottom: 2px;
            display: flex;
            justify-content: center;
        }

        .logo img {
            max-width: 100%;
            height: auto;
            max-height: 240px;
        }

        .tagline {
            color: var(--text-primary);
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            margin-top: -8px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.8) 0%, rgba(42, 26, 42, 0.8) 100%);
            border: 1.5px solid;
            border-image: linear-gradient(135deg, rgba(255, 20, 147, 0.5) 0%, rgba(255, 20, 147, 0.1) 100%) 1;
            border-radius: 16px;
            padding: 35px;
            box-shadow:
                0 0 60px rgba(255, 20, 147, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 20, 147, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 100% 0%, rgba(255, 20, 147, 0.05) 0%, transparent 50%);
            border-radius: 16px;
            pointer-events: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group:last-of-type {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-family: 'Figtree', sans-serif;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"],
        input[type="range"] {
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1.5px solid rgba(255, 20, 147, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus,
        input[type="range"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow:
                0 0 0 4px rgba(255, 20, 147, 0.15),
                0 0 20px rgba(255, 20, 147, 0.2);
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.05) 0%, rgba(255, 20, 147, 0.02) 100%);
        }

        .currency-label {
            position: absolute;
            right: 16px;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            pointer-events: none;
        }

        .percent-label {
            position: absolute;
            right: 16px;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            pointer-events: none;
        }

        .range-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .range-inputs input[type="range"] {
            flex: 1;
        }

        .range-inputs input[type="number"] {
            width: 70px;
            padding: 8px 12px;
        }

        input[type="range"] {
            padding: 0;
            height: 6px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.3);
            border: 2px solid var(--dark-secondary);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.3);
            border: 2px solid var(--dark-secondary);
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 20, 147, 0.3),
                rgba(255, 20, 147, 0.5),
                rgba(255, 20, 147, 0.3),
                transparent
            );
            margin: 30px 0;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.1);
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 0;
        }

        .result-box {
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.08) 0%, rgba(255, 20, 147, 0.02) 100%);
            border: 1.5px solid rgba(255, 20, 147, 0.3);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            box-shadow:
                0 8px 32px rgba(255, 20, 147, 0.1),
                inset 0 1px 0 rgba(255, 20, 147, 0.2);
            transition: all 0.3s ease;
        }

        .result-box:hover {
            border-color: var(--primary);
            box-shadow:
                0 12px 48px rgba(255, 20, 147, 0.2),
                inset 0 1px 0 rgba(255, 20, 147, 0.3);
        }

        .result-box.highlight {
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.15) 0%, rgba(212, 175, 55, 0.08) 100%);
            border-color: var(--primary);
            box-shadow:
                0 12px 40px rgba(255, 20, 147, 0.25),
                inset 0 1px 0 rgba(255, 20, 147, 0.3);
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-family: 'Figtree', sans-serif;
        }

        .result-value {
            font-size: 42px;
            font-weight: 400;
            color: var(--primary);
            letter-spacing: 0px;
            font-family: 'Satisfy', cursive;
        }

        .result-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .cta-section {
            text-align: center;
            margin-top: 25px;
        }

        .cta-text {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 16px;
            line-height: 1.6;
            font-family: 'Figtree', sans-serif;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 12px 40px rgba(255, 20, 147, 0.4),
                0 0 20px rgba(255, 20, 147, 0.2);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 16px 50px rgba(255, 20, 147, 0.5),
                0 0 30px rgba(255, 20, 147, 0.3);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .card {
                padding: 24px;
            }

            .logo {
                font-size: 24px;
            }

            .results {
                grid-template-columns: 1fr;
            }

            .result-value {
                font-size: 24px;
            }
        }
    </style>
</head>

            </div>
            <div class="tagline">Silent Churn Calculator</div>
        </div>

        <div class="card">
            <div class="input-group">
                <label for="newClients">New Clients Per Month</label>
                <div class="input-wrapper">
                    <input type="number" id="newClients" min="1" value="20" max="1000">
                </div>
            </div>

            <div class="input-group">
                <label for="servicePrice">Average Service Price</label>
                <div class="input-wrapper">
                    <input type="number" id="servicePrice" min="10" value="150" step="5" max="5000">
                    <span class="currency-label">$</span>
                </div>
            </div>

            <div class="input-group">
                <label for="churnRate">Current Rebooking Rate</label>
                <div class="range-inputs">
                    <input type="range" id="churnRate" min="0" max="100" value="45" step="1">
                    <input type="number" id="churnRateNumber" min="0" max="100" value="45" step="1">
                    <span class="percent-label">%</span>
                </div>
            </div>

            <div class="input-group">
                <label for="visitsPerYear">Average Visits Per Year (If They Return)</label>
                <div class="input-wrapper">
                    <input type="number" id="visitsPerYear" min="1" value="8" max="52" step="0.5">
                </div>
            </div>

            <div class="divider"></div>

            <div class="results">
                <div class="result-box">
                    <div class="result-label">Monthly Revenue at Risk</div>
                    <div class="result-value" id="revenueAtRisk">$12K</div>
                    <div class="result-subtext">Lost to churn</div>
                </div>

                <div class="result-box highlight">
                    <div class="result-label">Annual Impact</div>
                    <div class="result-value" id="annualImpact">$139K</div>
                    <div class="result-subtext">12 months of churn</div>
                </div>
            </div>

            <div class="cta-section">
                <p class="cta-text">More than half of first-time clients never rebook. Let 10house manage your retention strategy</p>
                <button class="cta-button" onclick="handleCTA()">Start Your Free Audit</button>
            </div>
        </div>
    </div>

    <script>
        const inputs = {
            newClients: document.getElementById('newClients'),
            servicePrice: document.getElementById('servicePrice'),
            churnRate: document.getElementById('churnRate'),
            churnRateNumber: document.getElementById('churnRateNumber'),
            visitsPerYear: document.getElementById('visitsPerYear')
        };

        const results = {
            revenueAtRisk: document.getElementById('revenueAtRisk'),
            annualImpact: document.getElementById('annualImpact')
        };

        function calculate() {
            const newClients = parseInt(inputs.newClients.value) || 0;
            const servicePrice = parseFloat(inputs.servicePrice.value) || 0;
            // The slider value is the REBOOKING rate (% of new clients who come back)
            const rebookingPct = Math.min(100, Math.max(0, parseFloat(inputs.churnRate.value) || 0));
            const visitsPerYear = parseFloat(inputs.visitsPerYear.value) || 0;

            const rebookingRate = rebookingPct / 100;
            const clientsLost = newClients * (1 - rebookingRate);
            // Conservative: first visit already happened, so only count the remaining visits
            const lostValuePerClient = Math.max(visitsPerYear - 1, 0) * servicePrice;
            const monthlyRevenueAtRisk = clientsLost * lostValuePerClient;
            const annualRevenueAtRisk = monthlyRevenueAtRisk * 12;

            results.revenueAtRisk.textContent = '$' + formatNumber(Math.round(monthlyRevenueAtRisk));
            results.annualImpact.textContent = '$' + formatNumber(Math.round(annualRevenueAtRisk));
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(0) + 'K';
            }
            return num.toString();
        }

        // Sync range and number inputs
        inputs.churnRate.addEventListener('input', () => {
            inputs.churnRateNumber.value = inputs.churnRate.value;
            calculate();
        });

        inputs.churnRateNumber.addEventListener('input', () => {
            inputs.churnRate.value = inputs.churnRateNumber.value;
            calculate();
        });

        // Calculate on all input changes
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', calculate);
        });

        // Initial calculation
        calculate();

        // Change this one line later if the audit form moves (e.g. audit.10house.us)
        const AUDIT_URL = 'https://tally.so/r/gDK7AP';

        function handleCTA() {
            const params = new URLSearchParams({
                newClients: inputs.newClients.value,
                servicePrice: inputs.servicePrice.value,
                churnRate: inputs.churnRate.value,
                visitsPerYear: inputs.visitsPerYear.value
            });
            window.location.href = `${AUDIT_URL}?${params.toString()}`;
        }
    </script>
